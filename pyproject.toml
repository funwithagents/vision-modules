[project]
name = "vision-modules"
version = "0.1.0"
description = "Composable vision modules over live video streams that give robots, systems, and agents richer perception for interaction."
readme = "README.md"
authors = [
    { name = "Thibault Hervier", email = "thibault@fr2g.io" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "opencv-python>=5.0.0.93",
]

[project.optional-dependencies]
hand = [
    "mediapipe>=1.0.1",
    "pillow>=12.3.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "vision-modules[hand]",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"  # keep in sync with requires-python

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "tests-e2e"]  # type-check test code too, not just src
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
