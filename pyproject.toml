[project]
name = "vision-modules"
version = "0.1.0"
description = "Composable vision modules over live video streams that give robots, systems, and agents richer perception for interaction."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Thibault Hervier", email = "thibault@fr2g.io" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
]

[project.optional-dependencies]
opencv = [
    "opencv-python>=5.0.0.93",
]
face-mediapipe = [
    "mediapipe>=0.10.35,<1.0",
]
hand = [
    "mediapipe>=0.10.35,<1.0",
    "pillow>=12.3.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
demo = [
    "gradio>=6.0,<7.0",
]
dev = [
    "vision-modules[face-mediapipe,hand,opencv]",
    {include-group = "demo"},
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[[tool.uv.index]]
# PyPI's Linux torch wheel is the CUDA build and drags gigabytes of NVIDIA libraries
# (a CI runner has no GPU); on Linux torch resolves from PyTorch's CPU index instead
# (the `torch` source below). `explicit`: only the packages pinned to it come from here.
# macOS and Windows keep PyPI's wheel, CPU-only there. A uv source is not inherited by
# a downstream project, which declares its own if it wants the CPU build.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
target-version = "py312"  # keep in sync with requires-python

[tool.pytest.ini_options]
# Only the fast, deterministic tier is collected by default; tests-e2e/ is opt-in.
testpaths = ["tests"]
pythonpath = ["examples"]  # so tests/test_hand_demo.py can import the demo's helpers

[tool.pyright]
include = ["src", "tests", "tests-e2e", "examples"]  # type-check tests and the demo too, not just src
extraPaths = ["examples"]  # resolve `import hand_demo` from tests/
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
